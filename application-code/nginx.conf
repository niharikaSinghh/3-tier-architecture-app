user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80;
        listen [::]:80;

        server_name _;

        # HTTP to HTTPS redirection is intentionally disabled.
        # This project uses the Application Load Balancer directly
        # without requiring a custom domain or TLS certificate.

        # Web Tier health check
        location /health {
            default_type text/html;
            return 200 "Web Tier Health Check\n";
        }

        # React application
        location / {
            root /home/ec2-user/web-tier/build;
            index index.html index.htm;
            try_files $uri /index.html;
        }

        # Proxy API requests to the Internal Application Load Balancer
        location /api/ {
            proxy_pass http://YOUR_INTERNAL_ALB_DNS_NAME:80/;
        }
    }
}